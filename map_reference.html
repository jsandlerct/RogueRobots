const COLS = 12;
const ROWS = 16;
const CELL = 18;
const W = COLS * CELL;
const H = ROWS * CELL;

const COLOR_WALL   = '#1e1e2e';
const COLOR_PATH   = '#4a7c59';
const COLOR_NPC    = '#e74c3c';
const COLOR_PLAYER = '#3498db';
const COLOR_GRID   = '#0d0d1a';

function renderMap(canvas, map) {
  const ctx = canvas.getContext('2d');
  canvas.width  = W;
  canvas.height = H;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const isPath = map.grid[r][c] === 1;
      ctx.fillStyle = isPath ? COLOR_PATH : COLOR_WALL;
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);

      // subtle grid lines
      ctx.strokeStyle = COLOR_GRID;
      ctx.lineWidth = 0.5;
      ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
    }
  }

  // NPC base marker at (col 0, row 0)
  ctx.fillStyle = COLOR_NPC;
  ctx.fillRect(0, 0, CELL, CELL);
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${CELL - 5}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('N', CELL / 2, CELL / 2);

  // Player base marker at (col 11, row 15)
  ctx.fillStyle = COLOR_PLAYER;
  ctx.fillRect(11 * CELL, 15 * CELL, CELL, CELL);
  ctx.fillStyle = '#fff';
  ctx.fillText('P', 11 * CELL + CELL / 2, 15 * CELL + CELL / 2);
}

const container = document.getElementById('container');

MAPS.forEach(map => {
  const card = document.createElement('div');
  card.className = 'map-card';

  const name = document.createElement('div');
  name.className = 'map-name';
  name.textContent = map.name;

  const desc = document.createElement('div');
  desc.className = 'map-desc';
  desc.textContent = map.desc;

  const canvas = document.createElement('canvas');
  card.appendChild(name);
  card.appendChild(desc);
  card.appendChild(canvas);
  container.appendChild(card);

  renderMap(canvas, map);
});
